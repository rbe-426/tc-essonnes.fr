<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <defs>
    <linearGradient id="iveco-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f0f0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a0a0a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#505050;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond transparent -->
  <rect width="200" height="120" fill="none"/>
  
  <!-- Texte IVECO en gros -->
  <text x="100" y="75" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#iveco-grad)" text-anchor="middle" letter-spacing="2">
    IVECO
  </text>
</svg>
